function home(){mode='home';app.innerHTML=`<section class="hero"><div><div class="eyebrow">English for university life</div><h1>Your vocabulary,<br><span style="color:#789982">your confidence.</span></h1><p>Learn 19 everyday activities through photos, definitions, and clear pronunciation. Then test what you know with 20 quick questions.</p></div><div class="hero-art"><div class="bubble">📚</div><div class="dot"></div></div></section><div class="section-head"><h2>Choose your learning path</h2><small>Unit 2B · Activities (1)</small></div><div class="tiles"><button class="tile" onclick="startFlash()"><span class="tile-icon">▤</span><h3>Learn vocabulary</h3><p>19 photographic flashcards · English definitions · Vietnamese meanings · listening practice</p><span class="go">Start learning &nbsp; →</span></button><button class="tile" onclick="startQuiz()"><span class="tile-icon">✓</span><h3>Check your vocabulary</h3><p>20 definition questions · randomized options · instant feedback · mistake review</p><span class="go">Start quiz &nbsp; →</span></button></div><div class="statbar"><div class="stat"><strong>${known.size}/19</strong> words learned</div><div class="stat"><strong>${review.size}</strong> to review</div><div class="stat"><strong>${best===null?'—':best+'/20'}</strong> personal best</div></div>`}
function startFlash(){mode='flash';order=words.map(w=>w.id);index=0;flipped=false;renderFlash()}
function renderFlash(){mode='flash';const w=wby(order[index]);app.innerHTML=`<div class="smalltop"><button class="back" onclick="home()">← Back to home</button><span class="tag">FLASHCARDS · ${index+1} / 19</span></div><div class="headrow"><h1>Learn vocabulary</h1><p>Explore each activity. Tap the card to ${flipped?'see the photo again':'reveal its meaning'}.</p></div><div class="progress"><div style="width:${(index+1)/19*100}%"></div></div><div class="toolbar"><span class="muted">${known.size} learned · ${review.size} for review</span><span><label class="muted" for="speed">Voice speed </label><select id="speed" onchange="rate=Number(this.value)"><option value="1" ${rate===1?'selected':''}>1×</option><option value="0.75" ${rate===.75?'selected':''}>0.75×</option></select> <button onclick="order=shuffle(order);index=0;flipped=false;renderFlash()">⇄ Shuffle</button></span></div><div class="flash" role="button" tabindex="0" aria-label="Flip vocabulary card" onclick="flipCard()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flipCard()}"><div class="visual"><img src="${w.img}" alt="Photograph illustrating ${w.term}"><span class="photo-label">${flipped?'Meaning revealed':'ACTIVITY '+(index+1)}</span></div><div class="details"><div class="mini">${flipped?'Definition & example':'Vocabulary card'}</div><div class="word">${w.term}</div><div class="ipa">${w.ipa}</div><div><button class="audio" onclick="event.stopPropagation();speak(${JSON.stringify(w.term).replaceAll('"','&quot;')})">🔊 Listen to word</button></div>${flipped?`<div class="definition">${w.def}</div><div class="meaning">${w.vi}</div><div class="example"><strong>Example</strong><br>${w.ex}<br><button class="audio" onclick="event.stopPropagation();speak(${JSON.stringify(w.ex).replaceAll('"','&quot;')})">🔊 Hear sentence</button></div>`:`<div class="definition" style="color:#6b7a77">Tap anywhere on the card to explore its meaning.</div>`}<div class="tip">↻ Click to flip</div></div></div><div class="flash-actions"><button class="secondary" onclick="stepFlash(-1)">← Previous</button><button class="secondary" onclick="markWord('review')">${review.has(w.id)?'✓ Review again':'↺ Review again'}</button><button class="secondary" onclick="markWord('known')">${known.has(w.id)?'✓ Learned':'✓ I know this'}</button><button class="primary" onclick="stepFlash(1)">${index===18?'Finish / Next →':'Next card →'}</button></div><div style="text-align:center;margin-top:25px"><button class="ghost" onclick="startQuiz()">Ready? Take the 20-question quiz →</button></div>`}
function flipCard(){flipped=!flipped;renderFlash()}
function stepFlash(d){index=(index+d+order.length)%order.length;flipped=false;renderFlash()}
function markWord(kind){let id=order[index];if(kind==='known'){known.add(id);review.delete(id)}else{review.add(id);known.delete(id)}persist();renderFlash()}
function startQuiz(){mode='quiz';questions=shuffle(bank.map(([def,correct],id)=>{const choices=shuffle([correct,...shuffle(words.filter(w=>w.id!==correct && !((correct==='walk'&&w.id==='outwalk')||(correct==='outwalk'&&w.id==='walk')||(correct==='movies'&&w.id==='movie')||(correct==='movie'&&w.id==='movies'))).map(w=>w.id)).slice(0,3)]);return{id,def,correct,choices}}));qi=0;selected=null;answers=[];renderQuiz()}
function renderQuiz(){mode='quiz';const q=questions[qi];let pct=Math.round((qi+1)/20*100);const cur=answers.filter(a=>a.correct).length;app.innerHTML=`<div class="smalltop"><button class="back" onclick="home()">← Back to home</button><span class="tag">DEFINITION QUIZ</span></div><div class="headrow"><h1>Check your vocabulary</h1><p>Read each definition and choose the correct activity.</p></div><div class="toolbar"><strong>Question ${qi+1} of 20</strong><span class="muted">${pct}% through quiz · ${cur} correct so far</span></div><div class="progress"><div style="width:${pct}%"></div></div><section class="quiz-card"><div class="question-head"><span class="eyebrow">What activity is this?</span><button class="audio" style="margin:0" onclick="speak(questions[qi].def)" aria-label="Listen to definition">🔊 Listen</button></div><div class="question">“${q.def}”</div><div class="choicegrid">${q.choices.map((id,i)=>`<button class="choice ${selected!==null?(id===q.correct?'correct':id===selected?'wrong':''):''}" onclick="choose('${id}')" ${selected!==null?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${wby(id).term}</span>${selected!==null&&id===q.correct?' ✓':''}</button>`).join('')}</div>${selected!==null?`<div class="feedback ${selected===q.correct?'':'bad'}"><strong>${selected===q.correct?'✓ Correct! Well done!':'Good try! The correct answer is '+wby(q.correct).term+'.'}</strong>${selected!==q.correct?`<span>${wby(q.correct).vi}</span><br>`:''}<button class="audio" onclick="speak(wby(questions[qi].correct).term)">🔊 Hear correct word</button></div><div class="nextrow"><button class="primary" onclick="nextQuestion()">${qi===19?'View results':'Next question'} →</button></div>`:''}</section>`}
function choose(id){if(selected!==null)return;selected=id;const q=questions[qi];answers.push({id:q.id,def:q.def,selected:id,correctId:q.correct,correct:id===q.correct});renderQuiz()}
function nextQuestion(){if(selected===null)return;if(qi===19){renderResults();return}qi++;selected=null;renderQuiz()}
function renderResults(){mode='results';const score=answers.filter(a=>a.correct).length,bad=answers.filter(a=>!a.correct);if(best===null||score>best)best=score;persist();const verdict=score>=18?'Excellent work!':score>=15?'Very good!':score>=10?'Good effort. Keep practicing!':'Review the vocabulary and try again!';app.innerHTML=`<div class="smalltop"><button class="back" onclick="home()">← Back to home</button><span class="tag">COMPLETED</span></div><div class="scorecard"><div class="eyebrow">Vocabulary check completed</div><div class="scorebig">${score}<span style="font-size:30px;color:#a1b3a6">/20</span></div><h1 style="font:800 29px Manrope;letter-spacing:-.04em">${verdict}</h1><div class="scores"><span>🎯 Accuracy <strong>${score*5}%</strong></span><span>✓ Correct <strong>${score}</strong></span><span>↺ Incorrect <strong>${20-score}</strong></span></div><div class="result-actions"><button class="primary" onclick="startQuiz()">Try again ↻</button><button class="secondary" onclick="startFlash()">Review flashcards</button><button class="secondary" onclick="home()">Back to home</button></div></div><div class="mistakes"><h2 style="font:800 22px Manrope">Review my mistakes (${bad.length})</h2>${bad.length===0?'<div class="empty">Excellent! You answered every question correctly.</div>':bad.map((a,i)=>`<div class="mistake"><strong>${i+1}. ${a.def}</strong><p style="color:#b35457">Your answer: ${wby(a.selected).term}</p><p style="color:#347a5d">Correct answer: <strong>${wby(a.correctId).term}</strong> · ${wby(a.correctId).vi}</p><button class="audio" onclick="speak(${JSON.stringify(wby(a.correctId).term).replaceAll('"','&quot;')})">🔊 Listen</button></div>`).join('')}</div>`}
window.addEventListener('pagehide',()=>{if('speechSynthesis'in window)speechSynthesis.cancel()});home();
</script></body></html>
